apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://helm.openwebui.com/"
    chart: open-webui
    targetRevision: "*"
    helm:
      values: |
        service:
          type: NodePort
          nodePort: 30090
        ollama:
          enabled: false
        openaiBaseApiUrl: "http://ai-proxy.default.svc.cluster.local:8080/v1"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
