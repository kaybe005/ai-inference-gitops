apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://helm.openwebui.com
    chart: open-webui
    targetRevision: "17.0.0"
    helm:
      values: |
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: "v0.5.10"
          pullPolicy: IfNotPresent
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

        tolerations:
          - operator: "Exists"

        ollama:
          enabled: false

        pipelines:
          enabled: false

        tika:
          enabled: false

        terminals:
          enabled: false

        websocket:
          enabled: false
          manager: ""
          redis:
            enabled: false

        enableOpenaiApi: true
        openaiBaseApiUrl: "http://ai-proxy.default.svc.cluster.local:8080/v1"
        openaiApiKey: ""
        openaiApiKeyExistingSecret: ""

        extraEnvVars:
          - name: DEFAULT_MODELS
            value: "llama3.2:3b"

        replicaCount: 1

        service:
          type: NodePort
          port: 80
          containerPort: 8080
          nodePort: 30090

        persistence:
          enabled: true
          provider: local
          size: 2Gi
          accessModes:
            - ReadWriteOnce

        extraInitContainers: []

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
