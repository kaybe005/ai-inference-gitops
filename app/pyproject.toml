[project]
name = "ai-inference-proxy"
version = "0.1.0"
description = "Configurable FastAPI proxy for mock and Ollama inference backends"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
