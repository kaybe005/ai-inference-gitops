name: Build and Publish AI Proxy

on:
  push:
    branches: [main]
    paths-ignore:
      - charts/ai-proxy/values.yaml
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ai-inference-proxy

jobs:
  verify:
    if: github.event_name == 'pull_request'
    name: Verify multi-architecture image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ai-inference-proxy:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish image and update GitOps tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Argo CD image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPOSITORY: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          values_file = Path("charts/ai-proxy/values.yaml")
          contents = values_file.read_text()
          updated, repository_replacements = re.subn(
              r'(?m)^  repository: [^\n]+$',
              f'  repository: {os.environ["IMAGE_REPOSITORY"]}',
              contents,
              count=1,
          )
          updated, tag_replacements = re.subn(
              r'(?m)^  tag: "[^"\n]+"$',
              f'  tag: "{os.environ["IMAGE_TAG"][:7]}"',
              updated,
              count=1,
          )
          if repository_replacements != 1 or tag_replacements != 1:
              raise SystemExit("Could not find the AI proxy image fields in Helm values")
          values_file.write_text(updated)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/ai-proxy/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy AI proxy ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
